<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TC Document Builder - Editable Documents</title>
<style>
:root{
  --green:#075b32;--green2:#0b7a45;--mint:#e8f5ee;--mint2:#f7fbf8;--line:#c7ded1;
  --text:#1f2f29;--muted:#697970;--cream:#fbfaf5;--danger:#b42318;--shadow:0 10px 30px rgba(6,48,30,.10)
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:linear-gradient(180deg,var(--mint2),var(--cream));color:var(--text)}
.app{max-width:1220px;margin:0 auto;min-height:100vh;background:#fff}
header{background:linear-gradient(135deg,#054927,var(--green));color:#fff;padding:22px;border-bottom-left-radius:28px;border-bottom-right-radius:28px;box-shadow:var(--shadow)}
.top{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border:2px solid rgba(255,255,255,.8);border-radius:50%;display:grid;place-items:center;font-size:24px}
h1{font-size:22px;margin:0}.sub{font-size:13px;opacity:.85;margin-top:4px}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.btn{border:0;border-radius:14px;padding:11px 14px;font-weight:850;background:var(--green);color:#fff}.btn.light{background:#fff;color:var(--green)}.btn.soft{background:var(--mint);color:var(--green)}.btn.danger{background:var(--danger)}
.headActions{display:flex;gap:10px;flex-wrap:wrap}.modeTabs{display:flex;gap:10px;margin-top:16px;overflow:auto}
.modeTab{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:10px 14px;font-weight:850;white-space:nowrap}
.modeTab.active{background:#fff;color:var(--green)}
main{display:grid;grid-template-columns:380px 1fr;gap:16px;padding:16px}
.panel,.previewWrap{border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 8px 22px rgba(9,59,35,.05)}
.panel{padding:14px;align-self:start;position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto}.previewWrap{padding:16px;overflow:auto}
.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:8px 0 10px}h2{font-size:17px;color:var(--green);margin:0}
label{display:block;font-size:12px;color:var(--muted);font-weight:800;margin:11px 0 6px}
input,select,textarea{width:100%;border:1px solid #cfe1d7;border-radius:14px;padding:11px 12px;background:#fff;color:var(--text);outline:none}textarea{min-height:88px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 10px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;color:var(--green);padding:8px 11px;font-size:12px;font-weight:850;white-space:nowrap}.tab.active{background:var(--green);color:#fff}
.docList{display:flex;flex-direction:column;gap:8px}.docItem{border:1px solid var(--line);border-radius:16px;padding:10px;background:linear-gradient(180deg,#fff,var(--mint2));display:flex;gap:10px;align-items:flex-start}
.docItem.active{outline:2px solid var(--green)}.code{background:var(--mint);color:var(--green);border-radius:10px;padding:6px 8px;font-weight:900;font-size:12px;min-width:76px;text-align:center}
.docItem h3{margin:0 0 4px;font-size:13px}.docItem p{margin:0;font-size:11px;color:var(--muted)}.pill{display:inline-flex;background:var(--mint);color:var(--green);border-radius:99px;padding:5px 9px;font-size:11px;font-weight:850}
.actions{display:flex;gap:10px;margin-top:13px}.actions .btn{flex:1}.muted{font-size:12px;color:var(--muted);line-height:1.4}
.box{border:1px dashed #a8c8b7;border-radius:16px;background:var(--mint2);padding:10px;margin:9px 0}.mini{display:grid;grid-template-columns:1fr 80px 38px;gap:8px;align-items:end}
.modeFill .buildOnly{display:none}.modeBuild .fillOnly{display:none}
.paper{width:794px;min-height:1123px;margin:0 auto;background:#fff;border:1px solid #d4e3da;box-shadow:0 12px 35px rgba(0,0,0,.12);padding:32px;position:relative}
.docHead{display:grid;grid-template-columns:1fr 260px;gap:14px;align-items:start;border-bottom:3px solid var(--green);padding-bottom:14px}.docHead h1{font-size:25px;color:var(--green);margin:0 0 4px}.subdoc{font-size:13px;color:var(--muted)}
.meta{border:1px solid var(--green);border-radius:12px;overflow:hidden;font-size:12px}.meta div{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #bfd5c8}.meta div:last-child{border-bottom:0}.meta b{background:var(--mint);padding:7px}.meta span{padding:7px}
.approve{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #bfd5c8;border-radius:12px;margin:14px 0;overflow:hidden}.approve div{padding:10px;text-align:center;border-right:1px solid #bfd5c8}.approve div:last-child{border-right:0}.approve b{color:var(--green);font-size:12px}.line{display:block;border-bottom:1px dotted #777;height:28px;margin-top:8px}
.docSection{border:1px solid #cfe1d7;border-radius:14px;margin:12px 0;overflow:hidden}.docSection h2{font-size:15px;background:var(--mint);padding:9px 12px;margin:0;color:var(--green)}.docSection .content{padding:11px 12px;font-size:13px;line-height:1.55;white-space:pre-wrap}
.docTable{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}.docTable th,.docTable td{border:1px solid #bfd5c8;padding:7px;vertical-align:top}.docTable th{background:var(--green);color:#fff;text-align:left}
.blank{border-bottom:1px dotted #777;display:inline-block;min-width:160px;min-height:18px}.filledValue{display:inline-block;min-width:160px;border-bottom:1px solid #777;min-height:18px;color:#111}
.footerNote{position:absolute;bottom:22px;left:32px;right:32px;border:1px solid #bfd5c8;border-radius:12px;background:var(--mint2);padding:10px;font-size:11px;color:var(--muted)}
.recordItem{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff;margin-bottom:8px}.recordItem b{color:var(--green)}
@media(max-width:900px){main{grid-template-columns:1fr}.panel{position:relative;max-height:none}.paper{width:100%;min-height:900px;padding:20px}.docHead{grid-template-columns:1fr}}
@media print{header,.panel,.sectionTitle{display:none!important}main{display:block;padding:0}.previewWrap{border:0;box-shadow:none;padding:0}.paper{width:210mm;min-height:297mm;border:0;box-shadow:none;margin:0;padding:14mm;page-break-after:always}.footerNote{left:14mm;right:14mm;bottom:10mm}}
</style>
</head>
<body class="modeBuild">
<div class="app">
<header>
  <div class="top">
    <div class="brand"><div class="logo">📄</div><div><h1>TC Document Builder</h1><div class="sub">เพิ่ม / แก้ไข / สร้าง Template เอกสาร และกรอกข้อมูลลงแบบฟอร์ม</div></div></div>
    <div class="headActions">
      <button class="btn light" onclick="window.print()">Export PDF</button>
      <button class="btn light" onclick="exportData()">Backup JSON</button>
      <button class="btn light" onclick="importDataClick()">Import JSON</button>
      <input id="importFile" type="file" accept="application/json" style="display:none" onchange="importData(this)">
    </div>
  </div>
  <div class="modeTabs">
    <button id="buildTab" class="modeTab active" onclick="setMode('build')">1) สร้าง/แก้ไขเอกสาร</button>
    <button id="fillTab" class="modeTab" onclick="setMode('fill')">2) กรอกข้อมูลลงเอกสาร</button>
  </div>
</header>

<main>
<aside class="panel">
  <div class="sectionTitle"><h2>เลือกเอกสาร</h2><span class="pill" id="countDoc"></span></div>
  <div id="tabs" class="tabs"></div>
  <label>ค้นหาเอกสาร</label>
  <input id="search" placeholder="เช่น FM-001, SOP, อาหาร" oninput="renderDocList()">
  <div id="docList" class="docList" style="margin-top:10px"></div>

  <div class="buildOnly">
    <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
    <div class="sectionTitle"><h2>จัดการเอกสาร</h2></div>
    <div class="actions">
      <button class="btn soft" onclick="newDocument()">+ เอกสารใหม่</button>
      <button class="btn soft" onclick="duplicateDocument()">คัดลอก</button>
      <button class="btn danger" onclick="deleteDocument()">ลบ</button>
    </div>

    <label>รหัสเอกสาร</label><input id="docCode" oninput="renameCodePreview()">
    <label>ชื่อเอกสาร</label><input id="docName" oninput="current.name=this.value;saveTemplate();updatePreview();renderDocList()">
    <div class="row2">
      <div><label>หมวด</label><select id="docGroup" onchange="current.g=this.value;saveTemplate();renderTabs();renderDocList()"></select></div>
      <div><label>ชนิด Layout</label><select id="docKind" onchange="current.kind=this.value;saveTemplate();updatePreview()"><option value="form">Form</option><option value="table">Table</option><option value="sop">SOP</option><option value="check">Checklist</option><option value="protocol">Protocol</option></select></div>
    </div>
    <div class="row2">
      <div><label>Version</label><input id="version" value="01" oninput="updatePreview()"></div>
      <div><label>Page</label><input id="pageNo" value="1/1" oninput="updatePreview()"></div>
    </div>
    <label>Effective Date</label><input id="effectiveDate" type="date" oninput="updatePreview()">
    <label>ชื่อแลป / บริษัท</label><input id="labName" value="Plant Tissue Culture Lab / Low-cost R&D / QA Microbiology" oninput="updatePreview()">
    <label>หมายเหตุท้ายเอกสาร</label><textarea id="footerText" oninput="updatePreview()">เอกสารควบคุม: สำเนาที่ไม่ได้รับการควบคุมจะถือเป็นเอกสารอ้างอิงเท่านั้น</textarea>

    <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
    <div class="sectionTitle"><h2>หัวข้อในเอกสาร</h2><button class="btn soft" style="padding:8px 10px" onclick="addSection()">+ Section</button></div>
    <div id="sectionEditor"></div>

    <div class="sectionTitle"><h2>ช่องกรอก/คอลัมน์</h2><button class="btn soft" style="padding:8px 10px" onclick="addField()">+ Field</button></div>
    <div id="fieldEditor"></div>

    <div class="actions">
      <button class="btn soft" onclick="saveTemplate()">บันทึก Template</button>
      <button class="btn" onclick="updatePreview()">Preview</button>
    </div>
  </div>

  <div class="fillOnly">
    <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
    <div class="sectionTitle"><h2>กรอกข้อมูล</h2><span class="pill">Fill</span></div>
    <div class="row2">
      <div><label>Record No.</label><input id="recordNo" oninput="updatePreview()"></div>
      <div><label>วันที่บันทึก</label><input id="recordDate" type="date" oninput="updatePreview()"></div>
    </div>
    <label>ผู้บันทึก</label><input id="recordBy" oninput="updatePreview()">
    <label>ผู้ตรวจสอบ/อนุมัติ</label><input id="reviewBy" oninput="updatePreview()">
    <div id="fillEditor"></div>
    <div class="actions">
      <button class="btn soft" onclick="clearFill()">ล้าง</button>
      <button class="btn" onclick="saveRecord()">บันทึก Record</button>
    </div>
    <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
    <div class="sectionTitle"><h2>Records</h2></div>
    <div id="recordList"></div>
  </div>
</aside>

<section class="previewWrap">
  <div class="sectionTitle"><h2 id="previewTitle">ตัวอย่างเอกสาร</h2><span class="pill">A4 Preview</span></div>
  <div id="paper" class="paper"></div>
</section>
</main>
</div>

<script>
const DEFAULT_GROUPS=["เริ่มต้น","SOP","WI","OPL","Forms","Logs","R&D","Inventory","Equipment","HR","Sales"];
const DEFAULT_TEMPLATES={
"ML-001":{g:"เริ่มต้น",name:"ทะเบียนเอกสาร (Document Master List)",kind:"table",sections:[["วัตถุประสงค์","ใช้ควบคุมรายการเอกสารทั้งหมดของระบบคุณภาพ เพื่อให้สามารถติดตามสถานะ เวอร์ชัน และการอนุมัติเอกสารได้อย่างเป็นระบบ"],["วิธีใช้","บันทึกรายการเอกสารที่มีผลบังคับใช้ทุกฉบับ และปรับปรุงทันทีเมื่อมีการแก้ไข เพิ่ม ยกเลิก หรือออกเอกสารใหม่"]],fields:["ลำดับ","รหัสเอกสาร","ชื่อเอกสาร","ประเภท","เวอร์ชัน","วันที่มีผลบังคับใช้","สถานะ","หมายเหตุ"]},
"SOP-001":{g:"SOP",name:"การควบคุมเอกสาร",kind:"sop",sections:[["วัตถุประสงค์","เพื่อควบคุมการจัดทำ ทบทวน อนุมัติ แจกจ่าย แก้ไข และยกเลิกเอกสารของระบบคุณภาพ"],["ขอบเขต","ครอบคลุมเอกสารประเภท SOP, WI, OPL, แบบฟอร์ม, บันทึก และเอกสารงานวิจัย"],["ขั้นตอนปฏิบัติ","1) กำหนดรหัสเอกสารและชื่อเอกสาร\n2) จัดทำร่างเอกสารตามรูปแบบที่กำหนด\n3) ทบทวนความถูกต้องและความเหมาะสม\n4) อนุมัติก่อนใช้งาน\n5) แจกจ่ายและควบคุมเวอร์ชันเอกสาร"]],fields:["ผู้จัดทำ","ผู้ทบทวน","ผู้อนุมัติ","หมายเหตุ"]},
"SOP-005":{g:"SOP",name:"การเตรียมอาหารเพาะเลี้ยง",kind:"sop",sections:[["วัตถุประสงค์","เพื่อกำหนดวิธีเตรียมอาหารเพาะเลี้ยงให้ถูกต้อง สม่ำเสมอ และตรวจสอบย้อนกลับได้"],["ขั้นตอนปฏิบัติ","1) ตรวจสอบสูตรและเอกสารอ้างอิง\n2) เตรียมน้ำ RO/DI และอุปกรณ์ที่สะอาด\n3) ชั่งสารหรือเตรียม Stock Solution ตามสูตร\n4) ปรับ pH ตามสูตรกำหนด\n5) แบ่งบรรจุลงขวด/ถุง PP\n6) ฆ่าเชื้อตามวิธีที่กำหนด\n7) ติดฉลาก"]],fields:["Batch No.","สูตรอาหาร","pH ก่อนปรับ","pH หลังปรับ","ผู้เตรียม","ผู้ตรวจสอบ"]},
"FM-001":{g:"Forms",name:"แบบฟอร์มเตรียมอาหารเพาะเลี้ยง",kind:"table",sections:[["ข้อมูล Batch","วันที่: {{วันที่}}  Batch No.: {{Batch No.}}  ชื่อสูตร: {{ชื่อสูตร}}  ปริมาตร: {{ปริมาตร}}\nผู้เตรียม: {{ผู้เตรียม}}  ผู้ตรวจสอบ: {{ผู้ตรวจสอบ}}"],["ข้อมูลควบคุมคุณภาพ","pH ก่อนปรับ: {{pH ก่อนปรับ}}  pH หลังปรับ: {{pH หลังปรับ}}  วิธีฆ่าเชื้อ: {{วิธีฆ่าเชื้อ}}"]],fields:["ลำดับ","รายการ","หน่วย","ปริมาณตามสูตร","ปริมาณจริง","Lot/Batch","หมายเหตุ"]},
"FM-006":{g:"Forms",name:"แบบฟอร์มตรวจพบ Contamination",kind:"form",sections:[],fields:["วันที่พบ","Bottle No./QR","สูตร/อาหาร","ชนิดพืช","อายุการเลี้ยง (วัน)","ประเภทการปนเปื้อน","ลักษณะที่พบ","การดำเนินการ","สาเหตุ/ป้องกันซ้ำ","ผู้บันทึก","ผู้ทบทวน"]},
"RC-001":{g:"Logs",name:"บันทึกอุณหภูมิ/ความชื้น/แสง",kind:"table",sections:[["ข้อมูลพื้นที่","พื้นที่/ห้อง: {{พื้นที่/ห้อง}}  เดือน/ปี: {{เดือน/ปี}}  ช่วงเป้าหมาย: Temp {{Temp Target}}°C / RH {{RH Target}}% / Light {{Light Target}} lux"]],fields:["วันที่","เวลา","อุณหภูมิ (°C)","ความชื้น (%RH)","แสง (lux)","ผู้บันทึก","หมายเหตุ"]},
"RD-001":{g:"R&D",name:"Protocol การทดลอง",kind:"protocol",sections:[["ข้อมูลโครงการ","ชื่อการทดลอง: {{ชื่อการทดลอง}}  รหัสโครงการ: {{รหัสโครงการ}}  ผู้รับผิดชอบ: {{ผู้รับผิดชอบ}}\nวันที่เริ่ม: {{วันที่เริ่ม}}  วันที่สิ้นสุด: {{วันที่สิ้นสุด}}"],["วัตถุประสงค์","{{วัตถุประสงค์}}"],["สมมติฐาน","{{สมมติฐาน}}"],["วิธีดำเนินการโดยสรุป","{{วิธีดำเนินการโดยสรุป}}"]],fields:["Treatment","รายละเอียด","จำนวนซ้ำ","หมายเหตุ"]},
"RM-001":{g:"Inventory",name:"Chemical Inventory",kind:"table",sections:[],fields:["Chemical ID","Chemical Name","Grade","Supplier","Lot No.","Received Date","Expiry Date","Quantity","Storage","Status"]},
"EQ-001":{g:"Equipment",name:"Equipment List",kind:"table",sections:[],fields:["Equipment ID","Equipment Name","Serial No.","Location","Responsible Person","Status"]},
"HR-001":{g:"HR",name:"Training Matrix",kind:"table",sections:[],fields:["ชื่อพนักงาน","ตำแหน่ง","SOP/WI ที่ต้องอบรม","สถานะ","วันที่ทบทวนถัดไป"]},
"PR-001":{g:"Sales",name:"Product Specification",kind:"form",sections:[],fields:["Product Code","Plant Type","Specification","Quality Criteria","Status"]}
};
let state=JSON.parse(localStorage.getItem("tc_doc_builder_editable_v1")||"null")||{templates:DEFAULT_TEMPLATES,records:[]};
let activeGroup="เริ่มต้น", selectedCode=Object.keys(state.templates)[0], mode="build", current=null, fillData={};

function init(){
  effectiveDate.value=new Date().toISOString().slice(0,10);
  recordDate.value=new Date().toISOString().slice(0,10);
  renderGroupOptions(); renderTabs(); loadTemplate(selectedCode); 
}
function saveState(){localStorage.setItem("tc_doc_builder_editable_v1",JSON.stringify(state))}
function setMode(m){mode=m;document.body.className=m==="fill"?"modeFill":"modeBuild";buildTab.classList.toggle("active",m==="build");fillTab.classList.toggle("active",m==="fill");previewTitle.textContent=m==="fill"?"เอกสารที่กรอกข้อมูลแล้ว":"ตัวอย่างเอกสาร";renderFillEditor();updatePreview()}
function groups(){return [...new Set([...DEFAULT_GROUPS,...Object.values(state.templates).map(t=>t.g)])]}
function renderGroupOptions(){docGroup.innerHTML=groups().map(g=>`<option>${esc(g)}</option>`).join("")}
function renderTabs(){tabs.innerHTML=groups().map(g=>`<button class="tab ${g===activeGroup?'active':''}" onclick="activeGroup='${js(g)}';renderTabs();renderDocList()">${esc(g)}</button>`).join("")}
function renderDocList(){
 const q=search.value.toLowerCase();
 const entries=Object.entries(state.templates).filter(([c,t])=>(t.g===activeGroup)&&((c+t.name+t.g).toLowerCase().includes(q)));
 countDoc.textContent=entries.length+" รายการ";
 docList.innerHTML=entries.map(([c,t])=>`<div class="docItem ${c===selectedCode?'active':''}" onclick="loadTemplate('${js(c)}')"><div class="code">${esc(c)}</div><div><h3>${esc(t.name)}</h3><p>${esc(t.g)} • ${esc(t.kind)}</p></div></div>`).join("")||`<div class="muted">ไม่พบเอกสารในหมวดนี้</div>`;
}
function loadTemplate(code){
 selectedCode=code; current=JSON.parse(JSON.stringify(state.templates[code])); fillData={};
 docCode.value=code; docName.value=current.name; docKind.value=current.kind; docGroup.value=current.g;
 recordNo.value=`${code}-${new Date().getFullYear()}-${String(state.records.filter(r=>r.code===code).length+1).padStart(4,"0")}`;
 renderEditors(); renderDocList(); renderFillEditor(); updatePreview();
}
function saveTemplate(){
 const newCode=(docCode.value||selectedCode).trim();
 if(!newCode){alert("กรุณาใส่รหัสเอกสาร");return}
 current.name=docName.value||"เอกสารใหม่"; current.g=docGroup.value; current.kind=docKind.value;
 if(newCode!==selectedCode){delete state.templates[selectedCode]; selectedCode=newCode}
 state.templates[selectedCode]=JSON.parse(JSON.stringify(current)); saveState(); renderGroupOptions(); renderTabs(); renderDocList(); updatePreview();
}
function renameCodePreview(){updatePreview()}
function newDocument(){
 const base="NEW-"+String(Object.keys(state.templates).length+1).padStart(3,"0");
 state.templates[base]={g:"Forms",name:"เอกสารใหม่",kind:"form",sections:[["วัตถุประสงค์",""]],fields:["วันที่","ผู้บันทึก","หมายเหตุ"]};
 saveState(); activeGroup="Forms"; renderGroupOptions(); renderTabs(); loadTemplate(base);
}
function duplicateDocument(){
 const code=prompt("รหัสเอกสารใหม่",selectedCode+"-COPY"); if(!code) return;
 if(state.templates[code]){alert("รหัสนี้มีอยู่แล้ว");return}
 state.templates[code]=JSON.parse(JSON.stringify(current)); state.templates[code].name=current.name+" (Copy)";
 saveState(); loadTemplate(code);
}
function deleteDocument(){
 if(!confirm("ต้องการลบเอกสารนี้จริงหรือไม่?")) return;
 delete state.templates[selectedCode]; saveState();
 selectedCode=Object.keys(state.templates)[0]||""; if(selectedCode) loadTemplate(selectedCode); else newDocument();
}
function renderEditors(){renderSectionEditor();renderFieldEditor()}
function renderSectionEditor(){
 sectionEditor.innerHTML=(current.sections||[]).map((s,i)=>`<div class="box">
  <div class="mini"><div><label>ชื่อหัวข้อ</label><input value="${attr(s[0])}" oninput="current.sections[${i}][0]=this.value;saveTemplate()"></div><div><label>ลำดับ</label><input value="${i+1}" disabled></div><button class="btn danger" style="padding:10px" onclick="removeSection(${i})">×</button></div>
  <label>เนื้อหา / ใช้ {{ชื่อช่อง}} เพื่อดึงข้อมูลตอนกรอก</label><textarea oninput="current.sections[${i}][1]=this.value;saveTemplate()">${esc(s[1])}</textarea>
 </div>`).join("");
}
function addSection(){current.sections=current.sections||[];current.sections.push(["หัวข้อใหม่",""]);renderSectionEditor();saveTemplate()}
function removeSection(i){current.sections.splice(i,1);renderSectionEditor();saveTemplate()}
function renderFieldEditor(){
 fieldEditor.innerHTML=(current.fields||[]).map((f,i)=>`<div class="box"><div class="mini">
 <div><label>ชื่อช่อง/คอลัมน์</label><input value="${attr(f)}" oninput="current.fields[${i}]=this.value;saveTemplate();renderFillEditor()"></div><div><label>ลำดับ</label><input value="${i+1}" disabled></div><button class="btn danger" style="padding:10px" onclick="removeField(${i})">×</button>
 </div></div>`).join("");
}
function addField(){current.fields=current.fields||[];current.fields.push("ช่องกรอกใหม่");renderFieldEditor();renderFillEditor();saveTemplate()}
function removeField(i){current.fields.splice(i,1);renderFieldEditor();renderFillEditor();saveTemplate()}
function getFillFields(){
 let set=new Set(current.fields||[]);
 (current.sections||[]).forEach(s=>{String(s[1]||"").replace(/\{\{(.+?)\}\}/g,(m,k)=>set.add(k.trim()))});
 return [...set];
}
function renderFillEditor(){
 if(!fillEditor||!current) return;
 fillEditor.innerHTML=getFillFields().map(f=>{
   const v=fillData[f]||"", long=/หมายเหตุ|รายละเอียด|สรุป|วิธี|วัตถุประสงค์|สมมติฐาน|ผล|สาเหตุ|ข้อเสนอแนะ|Specification|Criteria/.test(f);
   return `<label>${esc(f)}</label>${long?`<textarea oninput="fillData['${js(f)}']=this.value;updatePreview()">${esc(v)}</textarea>`:`<input value="${attr(v)}" oninput="fillData['${js(f)}']=this.value;updatePreview()">`}`;
 }).join("");
 renderRecordList();
}
function clearFill(){fillData={};recordBy.value="";reviewBy.value="";recordDate.value=new Date().toISOString().slice(0,10);renderFillEditor();updatePreview()}
function saveRecord(){
 const rec={id:crypto.randomUUID(),code:selectedCode,name:current.name,recordNo:recordNo.value,date:recordDate.value,by:recordBy.value,reviewBy:reviewBy.value,data:{...fillData},savedAt:new Date().toISOString()};
 state.records.push(rec); saveState(); renderRecordList(); alert("บันทึก Record แล้ว");
}
function renderRecordList(){
 const rows=state.records.filter(r=>r.code===selectedCode).slice().reverse();
 recordList.innerHTML=rows.map(r=>`<div class="recordItem" onclick="loadRecord('${r.id}')"><b>${esc(r.recordNo)}</b><br><span class="muted">${esc(r.date||"")} • ${esc(r.by||"-")}</span></div>`).join("")||`<div class="muted">ยังไม่มี Record</div>`;
}
function loadRecord(id){const r=state.records.find(x=>x.id===id); if(!r)return; recordNo.value=r.recordNo;recordDate.value=r.date;recordBy.value=r.by||"";reviewBy.value=r.reviewBy||"";fillData={...r.data};renderFillEditor();updatePreview()}
function updatePreview(){
 if(!current) return;
 const code=docCode.value||selectedCode, name=docName.value||current.name, kind=docKind.value||current.kind;
 let html=`<div class="docHead"><div><h1>${esc(name)}</h1><div class="subdoc">${esc(labName.value||"")}</div>${mode==="fill"?`<div class="subdoc"><b>Record No.:</b> ${esc(recordNo.value)} &nbsp; <b>Record Date:</b> ${esc(recordDate.value)}</div>`:""}</div>
 <div class="meta"><div><b>Document Code</b><span>${esc(code)}</span></div><div><b>Version</b><span>${esc(version.value)}</span></div><div><b>Effective Date</b><span>${esc(effectiveDate.value)}</span></div><div><b>Page</b><span>${esc(pageNo.value)}</span></div></div></div>
 <div class="approve"><div><b>จัดทำโดย</b><span class="line">${mode==="fill"?esc(recordBy.value):""}</span></div><div><b>ทบทวนโดย</b><span class="line">${mode==="fill"?esc(reviewBy.value):""}</span></div><div><b>อนุมัติโดย</b><span class="line"></span></div></div>`;
 (current.sections||[]).forEach(s=>html+=sectionHTML(s[0],replaceVars(s[1])));
 if(["table","protocol"].includes(kind)) html+=tableHTML(current.fields||[],kind==="protocol"?4:8);
 if(["form","check","sop"].includes(kind)) html+=formHTML(current.fields||[],kind);
 html+=`<div class="footerNote">${esc(footerText.value||"")}</div>`;
 paper.innerHTML=html;
}
function replaceVars(text){if(mode!=="fill")return text;return String(text||"").replace(/\{\{(.+?)\}\}/g,(m,k)=>fillData[k.trim()]||"__________")}
function valFor(f){return mode==="fill"?(fillData[f]||""):""}
function sectionHTML(title,content){const body=content?esc(content):`<span class="blank" style="width:95%"></span><br><span class="blank" style="width:95%"></span>`;return `<div class="docSection"><h2>${esc(title)}</h2><div class="content">${body}</div></div>`}
function tableHTML(cols,rows){let h=`<table class="docTable"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>`;for(let r=0;r<rows;r++){h+=`<tr>${cols.map(c=>`<td>${r===0&&valFor(c)?esc(valFor(c)):"&nbsp;<br>&nbsp;"}</td>`).join("")}</tr>`}return h+"</tbody></table>"}
function formHTML(fields,kind){let h=`<div class="docSection"><h2>${kind==="sop"?"บันทึกการทบทวน/ใช้งานเอกสาร":"รายละเอียดแบบฟอร์ม"}</h2><div class="content">`;fields.forEach(f=>{const v=valFor(f); if(kind==="check")h+=`${v?"☑":"□"} ${esc(f)} ${v&&v!=="✓"?": "+esc(v):""}<br>`;else h+=`<b>${esc(f)}:</b> ${v?`<span class="filledValue">${esc(v)}</span>`:`<span class="blank"></span>`}<br><br>`});return h+"</div></div>"}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="tc_document_builder_backup.json";a.click();URL.revokeObjectURL(a.href)}
function importDataClick(){importFile.click()}
function importData(input){const file=input.files[0]; if(!file)return; const reader=new FileReader(); reader.onload=()=>{try{state=JSON.parse(reader.result);saveState();selectedCode=Object.keys(state.templates)[0];loadTemplate(selectedCode);alert("Import สำเร็จ")}catch(e){alert("ไฟล์ไม่ถูกต้อง")}}; reader.readAsText(file)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function attr(s){return esc(s).replace(/"/g,"&quot;")} function js(s){return String(s??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\n/g,"\\n")}
init();
</script>
</body>
</html>
