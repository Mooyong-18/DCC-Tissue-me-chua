<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>TC Document Builder</title>
  <style>
    :root{
      --green:#075b32;--green2:#0c7a46;--mint:#e8f5ee;--mint2:#f7fbf8;--line:#c7ded1;
      --text:#1f2f29;--muted:#697970;--cream:#fbfaf5;--danger:#b42318;--shadow:0 10px 30px rgba(6,48,30,.10)
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:linear-gradient(180deg,var(--mint2),var(--cream));color:var(--text)}
    .app{max-width:1180px;margin:0 auto;min-height:100vh;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.04)}
    header{background:linear-gradient(135deg,#054927,var(--green));color:#fff;padding:22px;border-bottom-left-radius:28px;border-bottom-right-radius:28px;box-shadow:var(--shadow)}
    .top{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .brand{display:flex;gap:12px;align-items:center}
    .logo{width:48px;height:48px;border:2px solid rgba(255,255,255,.8);border-radius:50%;display:grid;place-items:center;font-size:24px}
    h1{font-size:22px;margin:0}.sub{font-size:13px;opacity:.85;margin-top:4px}
    .headActions{display:flex;gap:10px;flex-wrap:wrap}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .btn{border:0;border-radius:14px;padding:11px 14px;font-weight:850;background:var(--green);color:#fff}
    .btn.light{background:#fff;color:var(--green)}.btn.soft{background:var(--mint);color:var(--green)}.btn.danger{background:var(--danger)}
    main{display:grid;grid-template-columns:360px 1fr;gap:16px;padding:16px}
    .panel,.previewWrap{border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 8px 22px rgba(9,59,35,.05)}
    .panel{padding:14px;align-self:start;position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto}
    .previewWrap{padding:16px;overflow:auto}
    .sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:8px 0 10px}
    h2{font-size:17px;color:var(--green);margin:0}
    label{display:block;font-size:12px;color:var(--muted);font-weight:800;margin:11px 0 6px}
    input,select,textarea{width:100%;border:1px solid #cfe1d7;border-radius:14px;padding:11px 12px;background:#fff;color:var(--text);outline:none}
    textarea{min-height:88px;resize:vertical}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 10px}
    .tab{border:1px solid var(--line);background:#fff;border-radius:999px;color:var(--green);padding:8px 11px;font-size:12px;font-weight:850;white-space:nowrap}
    .tab.active{background:var(--green);color:#fff}
    .docList{display:flex;flex-direction:column;gap:8px}
    .docItem{border:1px solid var(--line);border-radius:16px;padding:10px;background:linear-gradient(180deg,#fff,var(--mint2));display:flex;gap:10px;align-items:flex-start}
    .docItem.active{outline:2px solid var(--green)}
    .code{background:var(--mint);color:var(--green);border-radius:10px;padding:6px 8px;font-weight:900;font-size:12px;min-width:76px;text-align:center}
    .docItem h3{margin:0 0 4px;font-size:13px}.docItem p{margin:0;font-size:11px;color:var(--muted)}
    .pill{display:inline-flex;background:var(--mint);color:var(--green);border-radius:99px;padding:5px 9px;font-size:11px;font-weight:850}
    .actions{display:flex;gap:10px;margin-top:13px}.actions .btn{flex:1}
    .fieldBox{border:1px dashed #a8c8b7;border-radius:16px;background:var(--mint2);padding:10px;margin:9px 0}
    .fieldBox .mini{display:grid;grid-template-columns:1fr 120px 38px;gap:8px;align-items:end}
    .muted{font-size:12px;color:var(--muted);line-height:1.4}
    .paper{width:794px;min-height:1123px;margin:0 auto;background:#fff;color:#1f2f29;border:1px solid #d4e3da;box-shadow:0 12px 35px rgba(0,0,0,.12);padding:32px;position:relative}
    .docHead{display:grid;grid-template-columns:1fr 260px;gap:14px;align-items:start;border-bottom:3px solid var(--green);padding-bottom:14px}
    .docHead h1{font-size:25px;color:var(--green);margin:0 0 4px}
    .docHead .subdoc{font-size:13px;color:var(--muted)}
    .meta{border:1px solid var(--green);border-radius:12px;overflow:hidden;font-size:12px}
    .meta div{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #bfd5c8}.meta div:last-child{border-bottom:0}
    .meta b{background:var(--mint);padding:7px}.meta span{padding:7px}
    .approve{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #bfd5c8;border-radius:12px;margin:14px 0;overflow:hidden}
    .approve div{padding:10px;text-align:center;border-right:1px solid #bfd5c8}.approve div:last-child{border-right:0}
    .approve b{color:var(--green);font-size:12px}.line{display:block;border-bottom:1px dotted #777;height:28px;margin-top:8px}
    .docSection{border:1px solid #cfe1d7;border-radius:14px;margin:12px 0;overflow:hidden}
    .docSection h2{font-size:15px;background:var(--mint);padding:9px 12px;margin:0;color:var(--green)}
    .docSection .content{padding:11px 12px;font-size:13px;line-height:1.55;white-space:pre-wrap}
    .docTable{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}.docTable th,.docTable td{border:1px solid #bfd5c8;padding:7px;vertical-align:top}.docTable th{background:var(--green);color:#fff;text-align:left}
    .blank{color:#777;border-bottom:1px dotted #777;display:inline-block;min-width:160px;height:18px}
    .footerNote{position:absolute;bottom:22px;left:32px;right:32px;border:1px solid #bfd5c8;border-radius:12px;background:var(--mint2);padding:10px;font-size:11px;color:var(--muted)}
    @media(max-width:900px){
      main{grid-template-columns:1fr}.panel{position:relative;max-height:none}.paper{width:100%;min-height:900px;padding:20px}.docHead{grid-template-columns:1fr}.meta{font-size:11px}
    }
    @media print{
      body,.app,.previewWrap{background:#fff;box-shadow:none;border:0;margin:0;padding:0}
      header,.panel{display:none!important}
      main{display:block;padding:0}
      .paper{width:210mm;min-height:297mm;border:0;box-shadow:none;margin:0;padding:14mm;page-break-after:always}
      .footerNote{left:14mm;right:14mm;bottom:10mm}
    }
  </style>
</head>
<body>
<div class="app">
<header>
  <div class="top">
    <div class="brand">
      <div class="logo">📄</div>
      <div>
        <h1>TC Document Builder</h1>
        <div class="sub">เว็บแอปสำหรับสร้างเอกสารและแบบฟอร์มเท่านั้น • ไม่ใช่ระบบบันทึกการใช้งานจริง</div>
      </div>
    </div>
    <div class="headActions">
      <button class="btn light" onclick="window.print()">Export PDF</button>
      <button class="btn light" onclick="downloadHTML()">Save HTML</button>
    </div>
  </div>
</header>

<main>
  <aside class="panel">
    <div class="sectionTitle"><h2>1) เลือกเอกสาร</h2><span class="pill" id="countDoc"></span></div>
    <div id="tabs" class="tabs"></div>
    <label>ค้นหาเอกสาร</label>
    <input id="search" placeholder="เช่น FM-001, SOP, อาหาร" oninput="renderDocList()">
    <div id="docList" class="docList" style="margin-top:10px"></div>

    <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
    <div class="sectionTitle"><h2>2) ตั้งค่าเอกสาร</h2></div>
    <div class="row2">
      <div><label>รหัสเอกสาร</label><input id="docCode" oninput="updatePreview()"></div>
      <div><label>Version</label><input id="version" value="01" oninput="updatePreview()"></div>
    </div>
    <label>ชื่อเอกสาร</label><input id="docName" oninput="updatePreview()">
    <div class="row2">
      <div><label>Effective Date</label><input id="effectiveDate" type="date" oninput="updatePreview()"></div>
      <div><label>Page</label><input id="pageNo" value="1/1" oninput="updatePreview()"></div>
    </div>
    <label>ชื่อแลป / บริษัท</label><input id="labName" value="Plant Tissue Culture Lab / Low-cost R&D / QA Microbiology" oninput="updatePreview()">
    <label>หมายเหตุท้ายเอกสาร</label><textarea id="footerText" oninput="updatePreview()">เอกสารควบคุม: สำเนาที่ไม่ได้รับการควบคุมจะถือเป็นเอกสารอ้างอิงเท่านั้น</textarea>

    <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
    <div class="sectionTitle"><h2>3) แก้ไขหัวข้อ/ช่องกรอก</h2><button class="btn soft" style="padding:8px 10px" onclick="addField()">+ Field</button></div>
    <div class="muted">ใช้ส่วนนี้เพื่อปรับแบบฟอร์มก่อน Export เป็น PDF หรือพิมพ์ออกมาเป็น Template เปล่า</div>
    <div id="fieldEditor"></div>
    <div class="actions">
      <button class="btn soft" onclick="resetTemplate()">Reset</button>
      <button class="btn" onclick="updatePreview()">Preview</button>
    </div>
  </aside>

  <section class="previewWrap">
    <div class="sectionTitle"><h2>ตัวอย่างเอกสาร</h2><span class="pill">A4 Preview</span></div>
    <div id="paper" class="paper"></div>
  </section>
</main>
</div>

<script>
const GROUPS = ["เริ่มต้น","SOP","WI","OPL","Forms","Logs","R&D","Inventory","Equipment","HR","Sales"];
const TEMPLATES = {

["ขั้นตอนปฏิบัติ","1) ตรวจพบและยืนยันลักษณะการปนเปื้อน\n2) แยกขวดออกจากขวดปกติทันที\n3) ติดป้าย Contamination\n4) บันทึกข้อมูลขวด สูตร วันที่ และลักษณะเชื้อ\n5) ทำลายหรือกำจัดตามวิธีที่กำหนด\n6) ทำความสะอาดพื้นที่\n7) ทบทวนสาเหตุและกำหนดการป้องกันซ้ำ"]

let activeGroup="เริ่มต้น";
let selectedCode="ML-001";
let customFields=[...TEMPLATES[selectedCode].fields||[]];
let customSections=JSON.parse(JSON.stringify(TEMPLATES[selectedCode].sections||[]));

function init(){
  effectiveDate.value = new Date().toISOString().slice(0,10);
  renderTabs(); renderDocList(); loadTemplate(selectedCode);
}
function renderTabs(){
  tabs.innerHTML=GROUPS.map(g=>`<button class="tab ${g===activeGroup?'active':''}" onclick="activeGroup='${g}';renderTabs();renderDocList()">${g}</button>`).join("");
}
function renderDocList(){
  const q=search.value.toLowerCase();
  const entries=Object.entries(TEMPLATES).filter(([c,t])=>(activeGroup==="All"||t.g===activeGroup) && (c.toLowerCase().includes(q)||t.name.toLowerCase().includes(q)||t.g.toLowerCase().includes(q)));
  countDoc.textContent=entries.length+" รายการ";
  docList.innerHTML=entries.map(([c,t])=>`<div class="docItem ${c===selectedCode?'active':''}" onclick="loadTemplate('${c}')"><div class="code">${c}</div><div><h3>${t.name}</h3><p>${t.g} • ${t.kind}</p></div></div>`).join("");
}
function loadTemplate(code){
  selectedCode=code;
  const t=TEMPLATES[code];
  docCode.value=code; docName.value=t.name;
  customFields=[...(t.fields||[])];
  customSections=JSON.parse(JSON.stringify(t.sections||[]));
  renderDocList(); renderFieldEditor(); updatePreview();
}
function resetTemplate(){ loadTemplate(selectedCode); }
function addField(){ customFields.push("ช่องกรอกใหม่"); renderFieldEditor(); updatePreview(); }
function removeField(i){ customFields.splice(i,1); renderFieldEditor(); updatePreview(); }
function renderFieldEditor(){
  fieldEditor.innerHTML = customFields.map((f,i)=>`
    <div class="fieldBox">
      <div class="mini">
        <div><label>ชื่อช่อง/คอลัมน์</label><input value="${escapeAttr(f)}" oninput="customFields[${i}]=this.value;updatePreview()"></div>
        <div><label>ลำดับ</label><input value="${i+1}" disabled></div>
        <button class="btn danger" style="padding:10px" onclick="removeField(${i})">×</button>
      </div>
    </div>`).join("");
}
function updatePreview(){
  const code=docCode.value||selectedCode;
  const name=docName.value||"";
  const t=TEMPLATES[selectedCode]||{};
  const kind=t.kind||"form";
  let html=`<div class="docHead">
    <div><h1>${escapeHTML(name)}</h1><div class="subdoc">${escapeHTML(labName.value||"")}</div></div>
    <div class="meta">
      <div><b>Document Code</b><span>${escapeHTML(code)}</span></div>
      <div><b>Version</b><span>${escapeHTML(version.value)}</span></div>
      <div><b>Effective Date</b><span>${escapeHTML(effectiveDate.value)}</span></div>
      <div><b>Page</b><span>${escapeHTML(pageNo.value)}</span></div>
    </div>
  </div>
  <div class="approve"><div><b>จัดทำโดย</b><span class="line"></span></div><div><b>ทบทวนโดย</b><span class="line"></span></div><div><b>อนุมัติโดย</b><span class="line"></span></div></div>`;
  customSections.forEach(s=>{ html += sectionHTML(s[0], s[1]); });
  if(kind==="sop") html += sectionHTML("เอกสารที่เกี่ยวข้อง","ระบุเอกสารอ้างอิง / แบบฟอร์มที่เกี่ยวข้อง: ______________________________");
  if(["table","protocol"].includes(kind)) html += tableHTML(customFields, kind==="protocol"?4:8);
  if(["form","check"].includes(kind)) html += formHTML(customFields, kind);
  html += `<div class="footerNote">${escapeHTML(footerText.value||"")}</div>`;
  paper.innerHTML=html;
}
function sectionHTML(title,content){
  const body = content ? escapeHTML(content) : `<span class="blank" style="width:95%"></span><br><span class="blank" style="width:95%"></span><br><span class="blank" style="width:95%"></span>`;
  return `<div class="docSection"><h2>${escapeHTML(title)}</h2><div class="content">${body}</div></div>`;
}
function tableHTML(cols, rows){
  let h=`<table class="docTable"><thead><tr>${cols.map(c=>`<th>${escapeHTML(c)}</th>`).join("")}</tr></thead><tbody>`;
  for(let r=0;r<rows;r++){ h+=`<tr>${cols.map(()=>`<td>&nbsp;<br>&nbsp;</td>`).join("")}</tr>`; }
  return h+`</tbody></table>`;
}
function formHTML(fields, kind){
  let h=`<div class="docSection"><h2>รายละเอียดแบบฟอร์ม</h2><div class="content">`;
  fields.forEach(f=>{
    if(kind==="check") h += `□ ${escapeHTML(f)}<br>`;
    else h += `<b>${escapeHTML(f)}:</b> <span class="blank"></span><br><br>`;
  });
  return h+`</div></div>`;
}
function downloadHTML(){
  const blob=new Blob([document.documentElement.outerHTML],{type:"text/html;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="tc_document_builder.html"; a.click(); URL.revokeObjectURL(a.href);
}
function escapeHTML(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));}
function escapeAttr(s){return escapeHTML(s).replace(/"/g,"&quot;");}
init();
</script>
